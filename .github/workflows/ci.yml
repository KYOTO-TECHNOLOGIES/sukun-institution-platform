name: Verify platform
on:
  push:
    branches-ignore: [production]
  pull_request:
  workflow_call:
    outputs:
      artifact_id:
        description: Verified release artifact ID
        value: ${{ jobs.containers.outputs.artifact_id }}
    inputs:
      package_release:
        type: boolean
        default: false
      architecture:
        type: string
        default: amd64
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sukun_test
          POSTGRES_USER: sukun
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sukun -d sukun_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: institution_management_application/sukun_lms
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-key-not-for-any-real-deployment-12345678901234567890
      DATABASE_URL: postgresql://sukun:ci-only-password@localhost:5432/sukun_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: institution_management_application/sukun_lms/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python -m unittest discover -s scripts/tests -v
        working-directory: .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sukun_lms_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sukun_lms_frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/dev.py setup
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  containers:
    needs: [api, frontend]
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    env:
      RELEASE_ARCH: ${{ inputs.architecture || 'amd64' }}
      COMPOSE_PROJECT_NAME: sukun-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml:deploy/compose.small-server.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated container configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, platform, re, secrets
          arch = os.environ['RELEASE_ARCH']
          expected = {'amd64': 'x86_64', 'arm64': 'aarch64'}
          if arch not in expected or platform.machine() != expected[arch]:
              raise SystemExit('Chosen architecture does not match this runner.')
          sha = os.environ['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('Expected a full source commit SHA.')
          text = Path('deploy/production.env.example').read_text()
          text = text.replace('replace-with-at-least-50-random-characters-generated-for-this-deployment', secrets.token_urlsafe(64))
          text = text.replace('replace-with-a-long-random-database-password', secrets.token_urlsafe(32))
          text = text.replace('lms.example.org', 'lms.sukunweb.com')
          Path('deploy/production.env').write_text(text)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SUKUN_SOURCE_REVISION=' + sha + '\n')
              output.write('SUKUN_HTTP_PORT=8080\n')
              for service in ('api', 'web'):
                  output.write(f'SUKUN_{service.upper()}_IMAGE=sukun-platform-{service}:sha-{sha}-{arch}\n')
          PY
      - run: docker compose --env-file deploy/production.env config --quiet
      - name: Verify server helper accepts the resolved infrastructure
        run: |
          SUKUN_HTTP_PORT=18080 COMPOSE_PROJECT_NAME=sukun_prod python3 - <<'PY'
          import json, os, subprocess
          from scripts.deploy_server import validate_compose
          config = json.loads(subprocess.check_output(['docker', 'compose', '--env-file', 'deploy/production.env', 'config', '--format', 'json'], text=True))
          validate_compose(config, {role: os.environ['SUKUN_' + role.upper() + '_IMAGE'] for role in ('api', 'web')})
          PY
      - run: docker compose --env-file deploy/production.env build api
      - run: docker compose --env-file deploy/production.env build web
      - run: docker compose --env-file deploy/production.env up -d --wait db redis
      - run: docker compose --env-file deploy/production.env run --rm --no-deps api python manage.py migrate --noinput
      - run: docker compose --env-file deploy/production.env run --rm --no-deps api python manage.py collectstatic --noinput
      - run: docker compose --env-file deploy/production.env run --rm --no-deps api python manage.py check --deploy
      - run: docker compose --env-file deploy/production.env up -d --no-build --wait
      - name: Verify production containers
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/health/
          curl --fail http://127.0.0.1:8080/ > /dev/null
          curl --fail -H 'Host: lms.sukunweb.com' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/api/auth/csrf/ > /dev/null
          curl --fail http://127.0.0.1:8080/static/core/receipt.js > /dev/null
          docker compose --env-file deploy/production.env exec -T web nginx -t
      - name: Package tested images and matching source
        if: ${{ inputs.package_release }}
        run: python3 scripts/package_release.py --architecture "$RELEASE_ARCH"
      - name: Upload server release
        id: artifact
        if: ${{ inputs.package_release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sukun-server-${{ github.sha }}-${{ env.RELEASE_ARCH }}-${{ github.run_attempt }}
          path: dist/server-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          include-hidden-files: false
      - name: Link release download
        if: ${{ inputs.package_release }}
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: printf '\n[Download the verified server release](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose --env-file deploy/production.env logs --tail=60
      - if: always()
        run: docker compose --env-file deploy/production.env down
