name: Verify platform
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sukun_test
          POSTGRES_USER: sukun
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sukun -d sukun_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: institution_management_application/sukun_lms
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-key-not-for-any-real-deployment-12345678901234567890
      DATABASE_URL: postgresql://sukun:ci-only-password@localhost:5432/sukun_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: institution_management_application/sukun_lms/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sukun_lms_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sukun_lms_frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/dev.py setup
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
